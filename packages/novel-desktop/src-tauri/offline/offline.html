<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灵器 AI — 无法连接</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        color: #24352e; background: #e9ece5; font-family: system-ui, sans-serif; }
      main { width: min(460px, calc(100% - 48px)); padding: 40px;
        background: #f8f7f0; border: 1px solid #c8d0c8; border-radius: 8px; }
      h1 { margin-top: 0; font-weight: 550; }
      p { line-height: 1.7; color: #5d6b64; }
      button { min-height: 42px; padding: 0 20px; border: 0; border-radius: 4px;
        color: white; background: #315f4c; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>暂时无法连接灵器 AI</h1>
      <p>请检查网络连接。你的项目和会话仍保存在服务器上。</p>
      <button id="retry" type="button">重新连接</button>
    </main>
    <script src="./recovery.js"></script>
  </body>
</html>
