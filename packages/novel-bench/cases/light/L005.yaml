script:
  - text: >-
      请让 outliner 基于现有世界观与人物，为第 1、2、3 章各写一张章卡，保存到 outline/ 目录。
      每张章卡正文必须写清四件事：目标、冲突、新信息、章末拉力；注意金手指「馋仙食谱」的代价要进冲突。不要向我提问，剧情设计自行决断。
